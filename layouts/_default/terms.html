{{ partial "header.html" . }}


<main>
    <header class="page-header">
        <h1>{{ .Title }}</h1>
    </header>
    <p class="tags">
        {{ range site.Taxonomies.tags.ByCount }}
            <span class="tag">
                <!-- prettier-ignore -->
                <a href="{{ .Page.Permalink }}">#{{ .Page.Title }}<sup class="count">{{ .Count }}</sup></a>
            </span>
        {{ else }}
            <p>No tags found</p>
        {{ end }}
    </p>
</main>

{{ partial "footer.html" . }}
