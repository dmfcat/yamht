{{ partial "header.html" . }}


<main>
    <header class="page-header">
        <h1>{{ .Title }}</h1>
    </header>
    <p class="tags">
        {{ $tags := site.Taxonomies.tags.ByCount }}
        {{ range $i, $tag := $tags }}
            {{ $tagPage := site.GetPage (printf "/tags/%s" ($tag.Term | urlize)) }}
            <span class="tag">
                <a href="{{ $tagPage.RelPermalink }}">#{{ $tag.Term }}</a
                ><sup class="count">{{ $tag.Count }}</sup>
            </span>
        {{ else }}
            <p>No tags found</p>
        {{ end }}
    </p>
</main>

{{ partial "footer.html" . }}
