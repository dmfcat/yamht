{{ partial "header.html" . }}


<main>
    <header class="page-header">
        <h1>{{ .Title }}</h1>
    </header>
    <p class="tags">
        {{ range site.Taxonomies.tags.ByCount }}
            {{ $tagPage := site.GetPage (printf "/tags/%s" (.Term | urlize)) }}
            <span class="tag">
                <a href="{{ $tagPage.RelPermalink }}">#{{ .Term }}</a
                ><sup class="count">{{ .Count }}</sup>
            </span>
        {{ else }}
            <p>No tags found</p>
        {{ end }}
    </p>
</main>

{{ partial "footer.html" . }}
