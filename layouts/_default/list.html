{{ partial "header.html" . }}

<h1>{{ .Title }}</h1>

{{ .Content }}

{{ range.Data.Pages }}
<article class="post-snippet">
  <h3>
    <a href="{{ .RelPermalink }}">{{ .Title }}</a>
  </h3>
	{{ with .Date }}
		<time datetime="{{ .Format "2006-01-02T15:04:05Z07:00" }}">
			{{ .Format "02/01/2006" }}
		</time>
	{{ end }}
	{{ with .Description }}
		<p>
			{{ . | truncate 80 }}
		</p>
	{{ end }}
</article>
{{ end }}

{{ partial "footer.html" . }}
