{{ partial "header.html" . }}


<main>
    <h1>{{ .Title }}</h1>

    <div class="page-content">
        {{ .Content }}

        {{ range.Data.Pages }}
            <article class="post-snippet">
                <header class="post-header">
                    <h3>
                        <a href="{{ .RelPermalink }}">{{ .Title }}</a>
                    </h3>
                </header>

                {{ with .Date }}
                    <div class="post-time">
                        <time
                            datetime="{{ .Format "2006-01-02T15:04:05Z07:00" }}"
                        >
                            {{ .Format "02/01/2006" }}
                        </time>
                    </div>
                {{ end }}

                {{ with .Description }}
                    <div class="post-content">
                        <p>
                            {{ . | truncate 80 }}
                        </p>
                    </div>
                {{ end }}
            </article>
        {{ end }}
    </div>
</main>

{{ partial "footer.html" . }}
