<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>
            <!-- prettier-ignore -->
            {{ if not .IsHome }}{{ .Title }} | {{ end }}{{ .Site.Title }}
        </title>
        {{ $css := resources.Get "css/style.css" | minify | fingerprint }}
        <link href="{{ $css.RelPermalink }}" rel="stylesheet" />
    </head>
    {{ partial "nav.html" . }}
</html>
