<header class="site-header">
    <nav class="site-nav">
        <a class="logo" href="{{ .Site.BaseURL }}"> {{ .Site.Title }} </a>
        <ul class="menu">
            {{ $currentPage := . }}
            {{ range .Site.Menus.main }}
                <li class="menu-item">
                    {{ if or ($currentPage.IsMenuCurrent "main" .)
                        ($currentPage.HasMenuCurrent "main" .)
                    }}
                        <a class="active" aria-current="page" href="{{ .URL }}"
                            >{{ .Name }}</a
                        >
                    {{ else }}
                        <a href="{{ .URL }}">{{ .Name }}</a>
                    {{ end }}
                </li>
            {{ end }}
        </ul>
    </nav>
</header>
