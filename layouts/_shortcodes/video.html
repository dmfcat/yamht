{{ $src := .Get "src" }}
{{ with .Page.Resources.Get $src }}
    <video
        controls
        preload="metadata"
        loading="lazy"
        src="{{ .RelPermalink }}"
    ></video>
{{ else }}
    <p>Video not found: {{ $src }}</p>
    {{ warnf "The %q shortcode was unable to find %s, see %s" $.Name $src $.Position }}
{{ end }}
